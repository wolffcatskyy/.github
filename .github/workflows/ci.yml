name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  lint:
    uses: ./.github/workflows/reusable-lint.yml
    with:
      shellcheck: false

  links:
    uses: ./.github/workflows/reusable-lychee.yml
